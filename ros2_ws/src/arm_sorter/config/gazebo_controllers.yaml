# For use only with a calibrated URDF containing gz_ros2_control interfaces.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
gripper_controller:
  ros__parameters:
    joints: [gripper_hinge_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
