controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    sim_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    sim_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
sim_arm_controller:
  ros__parameters:
    joints:
    - sim_joint_1
    - sim_joint_2
    - sim_joint_3
    - sim_joint_4
    - sim_joint_5
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    constraints:
      goal_time: 3.0
      sim_joint_1:
        trajectory: 0.2
        goal: 0.03
      sim_joint_2:
        trajectory: 0.2
        goal: 0.03
      sim_joint_3:
        trajectory: 0.2
        goal: 0.03
      sim_joint_4:
        trajectory: 0.2
        goal: 0.03
      sim_joint_5:
        trajectory: 0.2
        goal: 0.03
sim_gripper_controller:
  ros__parameters:
    joints:
    - sim_finger_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    constraints:
      goal_time: 3.0
      sim_finger_joint:
        trajectory: 0.10
        goal: 0.015
